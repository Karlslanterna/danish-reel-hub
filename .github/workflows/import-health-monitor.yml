name: Import health monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-health-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check canonical source freshness
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$body" \
            --write-out '%{http_code}' \
            --max-time 60 \
            'https://lanterna.dk/api/public/import-health?monitor=1')"

          cat "$body"
          echo
          echo "HTTP $status"

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "::error::Application-level import health is failing. See JSON above for the affected source."
            exit 1
          fi
