name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite/TanStack owns routeTree.gen.ts. Build once first so newly added
      # file routes are generated before TypeScript checks the route registry.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  parity:
    name: Production canonical/legacy parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Compare production screenings with legacy showtimes
        id: parity
        # A pull request cannot repair already deployed production data. Keep
        # the finding visible on PRs; manual post-deploy runs remain blocking.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: node scripts/check-screening-parity.mjs

      - name: Diagnose eBillet gaps against upstream
        if: steps.parity.outcome == 'failure'
        run: node scripts/diagnose-ebillet-parity.mjs

      - name: Explain production-only parity finding
        if: steps.parity.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::warning::The canonical/legacy parity check found an issue on the currently deployed lanterna.dk. It is advisory on pull requests and blocking on manual post-deploy runs."
          echo "### Production parity finding" >> "$GITHUB_STEP_SUMMARY"
          echo "The parity check found an issue on the currently deployed **lanterna.dk**. This PR cannot change production data before merge/deploy. Run this workflow manually after deployment; the same check is then blocking." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on parity mismatch
        if: steps.parity.outcome == 'failure' && github.event_name != 'pull_request'
        run: exit 1

  catalog-audit:
    name: Production catalog audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Audit every active movie and filter value
        id: catalog
        # A pull request cannot change the already deployed lanterna.dk. Keep
        # the live finding visible, but let PR-local tests decide whether the
        # proposed code is mergeable. Manual post-deploy runs remain blocking.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: node scripts/audit-public-catalog.mjs

      - name: Explain production-only finding
        if: steps.catalog.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::warning::The production catalog audit found an issue on the currently deployed lanterna.dk. It is advisory on pull requests and blocking on manual post-deploy runs."
          echo "### Production catalog finding" >> "$GITHUB_STEP_SUMMARY"
          echo "The audit found an issue on the currently deployed **lanterna.dk**. This is advisory here because a pull request cannot change production before merge and Lovable deployment. Run this workflow manually after deployment; the same audit is then blocking." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify, parity, catalog-audit]
    # Pin this tag to the exact @playwright/test version in package.json. The
    # image already contains Chromium and its OS dependencies, so CI does not
    # depend on a fresh apt installation from the runner's Ubuntu mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    env:
      SMOKE_BASE_URL: https://lanterna.dk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests against production
        id: smoke
        # The PR cannot change the already deployed site. Keep live failures
        # visible before merge; manual post-deploy runs remain blocking.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm run test:smoke

      - name: Upload Playwright report on failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Explain production-only smoke findings
        if: steps.smoke.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::warning::The smoke tests found issues on the currently deployed lanterna.dk. They are advisory on pull requests and blocking on manual post-deploy runs."
          echo "### Production smoke findings" >> "$GITHUB_STEP_SUMMARY"
          echo "The smoke tests found issues on the currently deployed **lanterna.dk**. This is advisory here because a pull request cannot change production before merge and Lovable deployment. The Playwright report is attached. Run this workflow manually after deployment; the same tests are then blocking." >> "$GITHUB_STEP_SUMMARY"

  performance:
    name: Production mobile performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [smoke]
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    env:
      PERF_BASE_URL: https://lanterna.dk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Measure production mobile performance
        id: performance
        # PRs can only measure the currently deployed site. The same test is
        # blocking when the workflow is dispatched after Lovable deployment.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm run test:performance

      - name: Upload performance report on failure
        if: steps.performance.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-performance
          path: playwright-report-performance/
          if-no-files-found: ignore
          retention-days: 7

      - name: Explain production-only performance findings
        if: steps.performance.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::warning::The mobile performance budgets failed on the currently deployed lanterna.dk. This is advisory on pull requests and blocking on the manual post-deploy run."
          echo "### Production performance finding" >> "$GITHUB_STEP_SUMMARY"
          echo "The performance test measured the currently deployed **lanterna.dk**, not the pull-request code. Re-run this workflow manually after Lovable deployment; the performance budgets are then blocking." >> "$GITHUB_STEP_SUMMARY"
